<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taom AI — kaloriya hisoblagich</title>
<meta name="description" content="Ovqatingizni suratga oling — kaloriyasini sun’iy intellekt hisoblaydi.">
<meta name="theme-color" content="#1B2A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taom AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=5">
<script>
  // mavzuni darhol qo‘llash (oq chaqnashsiz)
  try {
    var t = localStorage.getItem('taom.theme') || 'auto';
    if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>Taom AI ishlashi uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>
<script type="module" src="js/app.js?v=5"></script>
<script>
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
</html>
